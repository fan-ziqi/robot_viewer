<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a84ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#409cff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Motion waves -->
  <path d="M 20 30 Q 35 25 50 30 T 80 30" stroke="url(#grad)" stroke-width="4" fill="none" stroke-linecap="round">
    <animate attributeName="d" 
             values="M 20 30 Q 35 25 50 30 T 80 30;
                     M 20 30 Q 35 35 50 30 T 80 30;
                     M 20 30 Q 35 25 50 30 T 80 30"
             dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M 20 50 Q 35 45 50 50 T 80 50" stroke="url(#grad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
    <animate attributeName="d" 
             values="M 20 50 Q 35 45 50 50 T 80 50;
                     M 20 50 Q 35 55 50 50 T 80 50;
                     M 20 50 Q 35 45 50 50 T 80 50"
             dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </path>
  
  <path d="M 20 70 Q 35 65 50 70 T 80 70" stroke="url(#grad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5">
    <animate attributeName="d" 
             values="M 20 70 Q 35 65 50 70 T 80 70;
                     M 20 70 Q 35 75 50 70 T 80 70;
                     M 20 70 Q 35 65 50 70 T 80 70"
             dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </path>
</svg>

